<form id="reportForm">
    <div class="form-group">
        <label>ФИО Сотрудника:</label>
        <input type="text" id="owner" name="owner" required>
    </div>

    <hr>
    <h3>Список инструментов:</h3>
    
    <div id="toolsContainer">
        <div class="tool-item" style="border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 4px;">
            <div class="form-group">
                <label>Инструмент / Параметры:</label>
                <input type="text" name="params" required>
            </div>
            <div class="form-group">
                <label>Причина неисправности:</label>
                <input type="text" name="reason" required>
            </div>
            <div class="form-group">
                <label>Фотография поломки:</label>
                <input type="file" name="photos" accept="image/*" required>
            </div>
        </div>
    </div>

    <button type="button" id="addToolBtn" style="background: #28a745; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 20px;">
        + Добавить инструмент
    </button>

    <br>
    <button type="submit" style="background: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
        Отправить общий отчет
    </button>
</form>

<script>
    // 1. Логика кнопки "+ Добавить инструмент"
    document.getElementById('addToolBtn').addEventListener('click', () => {
        const container = document.getElementById('toolsContainer');
        
        // Создаем новый блок инструмента
        const newTool = document.createElement('div');
        newTool.className = 'tool-item';
        newTool.style = "border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 4px; position: relative;";
        
        newTool.innerHTML = `
            <button type="button" onclick="this.parentElement.remove()" style="position: absolute; right: 10px; top: 10px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">Удалить позицию</button>
            <div class="form-group">
                <label>Инструмент / Параметры:</label>
                <input type="text" name="params" required>
            </div>
            <div class="form-group">
                <label>Причина неисправности:</label>
                <input type="text" name="reason" required>
            </div>
            <div class="form-group">
                <label>Фотография поломки:</label>
                <input type="file" name="photos" accept="image/*" required>
            </div>
        `;
        container.appendChild(newTool);
    });

    // 2. Логика перехвата отправки формы
    document.getElementById('reportForm').addEventListener('submit', async (e) => {
        e.preventDefault(); // Запрещаем стандартную перезагрузку страницы
        
        const formData = new FormData();
        formData.append('owner', document.getElementById('owner').value);

        // Собираем все добавленные инструменты поочередно
        const toolItems = document.querySelectorAll('.tool-item');
        toolItems.forEach((item) => {
            const params = item.querySelector('input[name="params"]').value;
            const reason = item.querySelector('input[name="reason"]').value;
            const photoFile = item.querySelector('input[name="photos"]').files[0];

            // Отправляем массивами (бэкэнд поймет)
            formData.append('params[]', params);
            formData.append('reason[]', reason);
            if (photoFile) {
                formData.append('photos', photoFile); // Все фото кидаем в одно поле multer
            }
        });

        // Отправляем собранные данные на сервер
        try {
            const response = await fetch('/send-report', {
                method: 'POST',
                body: formData
            });
            const resultHtml = await response.text();
            document.body.innerHTML = resultHtml; // Показываем ответ сервера (Успешно/Ошибка)
        } catch (error) {
            alert('Ошибка при связи с сервером.');
        }
    });
</script>
